<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    A globe in the site's own four yarn colours, drawn to stay legible at
    16px: one ocean disc, three land masses with real silhouettes, and a
    graticule. The previous icon was stock clip art in colours the site does
    not use anywhere.
  -->
  <defs>
    <clipPath id="globe">
      <circle cx="32" cy="32" r="29"/>
    </clipPath>
  </defs>

  <circle cx="32" cy="32" r="29" fill="#779fc4"/>

  <g clip-path="url(#globe)">
    <!-- Africa and Europe, the face that reads best small. -->
    <path fill="#b2c8a9" d="M30 10c4 0 7 2 9 4s1 5 3 6 4 0 4 3-3 4-4 7-1 7-4 11-4 10-7 10-4-4-5-8-4-6-5-10-1-8 1-12 4-11 8-11z"/>
    <!-- Scandinavia / northern Europe. -->
    <path fill="#b2c8a9" d="M36 8c3-1 6 0 7 2s-2 3-4 3-4-3-3-5z"/>
    <!-- A hint of the Americas at the western limb. -->
    <path fill="#b2c8a9" d="M8 22c3-1 5 1 6 4s-1 5-1 8 2 5 1 8-3 3-5 1-3-6-3-11 0-9 2-10z"/>
    <!-- Polar ice, top and bottom. -->
    <path fill="#e9f0f8" d="M3 30a29 29 0 0 1 6-16 38 38 0 0 0 46 0 29 29 0 0 1 6 16z" opacity="0"/>
    <ellipse cx="32" cy="4" rx="20" ry="6" fill="#e9f0f8"/>
    <ellipse cx="32" cy="60" rx="17" ry="5" fill="#f1e7d4"/>

    <!-- Graticule, as on a printed map. -->
    <g fill="none" stroke="#22201c" stroke-opacity="0.16" stroke-width="1.1">
      <circle cx="32" cy="32" r="29"/>
      <line x1="3" y1="32" x2="61" y2="32"/>
      <ellipse cx="32" cy="32" rx="10" ry="29"/>
      <ellipse cx="32" cy="32" rx="21" ry="29"/>
      <path d="M6 18h52M6 46h52"/>
    </g>
  </g>

  <circle cx="32" cy="32" r="29" fill="none" stroke="#22201c" stroke-opacity="0.5" stroke-width="2"/>
</svg>
